name: Sync Keycloak realm

# Keeps keycloak/survey-school-realm.json in sync with the source-of-truth copy
# in the jackpoll monorepo (apps/backend). Runs on a schedule and on manual
# dispatch; opens a PR here whenever the backend realm changes.
#
# SETUP: add a repository secret `BACKEND_REPO_TOKEN` — a fine-grained PAT with
# read access to jackpoll-org/jackpoll (contents: read). Without it the checkout
# of a private repo will fail.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selfhost repo
        uses: actions/checkout@v4

      - name: Checkout backend realm
        uses: actions/checkout@v4
        with:
          repository: jackpoll-org/jackpoll
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: .monorepo
          sparse-checkout: apps/backend/src/main/keycloak/survey-school-realm.json
          sparse-checkout-cone-mode: false

      - name: Copy realm
        run: cp .monorepo/apps/backend/src/main/keycloak/survey-school-realm.json keycloak/survey-school-realm.json

      - name: Open PR on change
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: keycloak/survey-school-realm.json
          branch: chore/sync-realm
          title: "chore: sync Keycloak realm from jackpoll backend"
          commit-message: "chore: sync Keycloak realm from jackpoll backend"
          body: |
            Automated sync of `keycloak/survey-school-realm.json` from
            `jackpoll-org/jackpoll` (`apps/backend/src/main/keycloak`).
          delete-branch: true
