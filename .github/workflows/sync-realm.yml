name: Sync Keycloak realm

# Keeps keycloak/survey-school-realm.json in sync with the source-of-truth copy
# in the jackpoll monorepo (apps/backend). Runs on a schedule and on manual
# dispatch; commits to master whenever the backend realm changes.
# jackpoll-org/jackpoll is public, so the default token can read it.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selfhost repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout backend realm
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: jackpoll-org/jackpoll
          path: .monorepo
          sparse-checkout: apps/backend/src/main/keycloak/survey-school-realm.json
          sparse-checkout-cone-mode: false

      - name: Copy realm
        run: cp .monorepo/apps/backend/src/main/keycloak/survey-school-realm.json keycloak/survey-school-realm.json

      - name: Commit & push if changed
        run: |
          git config user.name "Leopold"
          git config user.email "77323443+MadebyLeopold@users.noreply.github.com"
          git add keycloak/survey-school-realm.json
          if git diff --cached --quiet; then
            echo "Realm already in sync."
            exit 0
          fi
          n=$(grep -oE 'keycloak_realm_v[0-9]+' docker-compose.swarm.yml | head -1 | grep -oE '[0-9]+$')
          sed -i "s/keycloak_realm_v$n/keycloak_realm_v$((n + 1))/g" docker-compose.swarm.yml
          git add docker-compose.swarm.yml
          git commit -m "chore: sync Keycloak realm from jackpoll backend"
          git push
